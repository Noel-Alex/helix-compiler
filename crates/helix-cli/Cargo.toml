[package]
name = "helix-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "helix"
path = "src/main.rs"

[dependencies]
helix-syntax = { workspace = true }
helix-sema = { workspace = true }
helix-ir = { workspace = true }
helix-analysis = { workspace = true }
helix-backend = { workspace = true }
helix-runtime = { workspace = true }
helix-engine = { workspace = true }
helix-bench = { workspace = true }
helix-observe = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
webbrowser = { workspace = true }
windows-sys = { version = "0.59", features = ["Win32_System_Threading"] }

[features]
default = []
bench-native = ["helix-bench/bench-native"]
